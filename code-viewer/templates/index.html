<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>验证码实时查看器</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#262b36; --text:#e6e9ef;
    --muted:#8b93a3; --accent:#4f8cff; --green:#34c759; --sms:#ff9f0a;
    --qq:#12b7f5; --gmail:#ea4335; --flash:rgba(79,140,255,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky;top:0;z-index:10;
    background:rgba(15,17,21,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);padding:16px 24px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  header h1{font-size:18px;font-weight:600}
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);transition:.3s}
  header .dot.live{background:var(--green);box-shadow:0 0 8px var(--green)}
  header .status{font-size:13px;color:var(--muted)}
  header .count{margin-left:auto;font-size:13px;color:var(--muted)}
  header .count b{color:var(--accent)}

  .tabs{display:flex;gap:8px;padding:12px 24px 0;flex-wrap:wrap}
  .tab{
    background:var(--panel);border:1px solid var(--border);color:var(--muted);
    padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:.2s;
  }
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tab:hover:not(.active){color:var(--text)}

  main{max-width:760px;margin:0 auto;padding:16px 24px 80px}
  .empty{
    text-align:center;color:var(--muted);padding:80px 20px;font-size:14px;
  }
  .empty .big{font-size:42px;margin-bottom:12px;opacity:.4}

  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;
    transition:background .3s,transform .15s;position:relative;overflow:hidden;
  }
  .card.new{animation:flash 1.2s ease-out}
  @keyframes flash{0%{background:var(--flash);transform:translateY(-4px)}100%{background:var(--panel);transform:none}}
  .card:hover{border-color:var(--accent)}
  .card .code{
    font-family:"SF Mono",Consolas,Menlo,monospace;font-size:24px;font-weight:600;
    letter-spacing:2px;color:var(--accent);min-width:130px;cursor:pointer;
    user-select:all;
  }
  .card .meta{flex:1;min-width:0}
  .card .top{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
  .badge{
    font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;
    white-space:nowrap;
  }
  .badge.sms{background:rgba(255,159,10,.15);color:var(--sms)}
  .badge.qq{background:rgba(18,183,245,.15);color:var(--qq)}
  .badge.gmail{background:rgba(234,67,53,.15);color:var(--gmail)}
  .card .time{font-size:12px;color:var(--muted);margin-left:auto}
  .card .info{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%}
  .card .info b{color:var(--text);font-weight:500}
  .copy{
    background:var(--accent);color:#fff;border:none;padding:8px 14px;
    border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;
    transition:opacity .2s;
  }
  .copy:hover{opacity:.85}
  .copy.done{background:var(--green)}

  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
    background:var(--green);color:#fff;padding:10px 20px;border-radius:8px;
    font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:100;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>验证码实时查看器</h1>
  <span class="status" id="status">连接中…</span>
  <span class="count" id="count">共 <b id="countNum">0</b> 条</span>
</header>

<div class="tabs">
  <div class="tab active" data-filter="all">全部</div>
  <div class="tab" data-filter="短信">短信</div>
  <div class="tab" data-filter="QQ邮箱">QQ邮箱</div>
  <div class="tab" data-filter="Gmail">Gmail</div>
</div>

<main id="list">
  <div class="empty" id="empty">
    <div class="big">⏳</div>
    等待收到验证码…<br>收到短信或邮箱验证码后会自动显示在这里
  </div>
</main>

<div class="toast" id="toast">已复制到剪贴板</div>

<script>
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const dot = document.getElementById('dot');
const status = document.getElementById('status');
const countNum = document.getElementById('countNum');
const toast = document.getElementById('toast');
let allItems = [];
let filter = 'all';

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    filter = t.dataset.filter;
    render();
  });
});

function badgeClass(source){
  if(source==='短信') return 'sms';
  if(source==='QQ邮箱') return 'qq';
  if(source==='Gmail') return 'gmail';
  return 'sms';
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const items = filter==='all' ? allItems : allItems.filter(i=>i.source===filter);
  list.innerHTML='';
  if(items.length===0){
    const e=empty.cloneNode(true);
    e.querySelector('.big').textContent='📭';
    e.lastChild.textContent = filter==='all' ? '等待收到验证码…' : '该来源暂无验证码';
    list.appendChild(e);
  }else{
    items.forEach((it,idx)=>{
      const card=document.createElement('div');
      card.className='card'+(idx===0 && it._fresh ? ' new':'');
      card.innerHTML=`
        <div class="code" title="点击复制">${escapeHtml(it.code||'—')}</div>
        <div class="meta">
          <div class="top">
            <span class="badge ${badgeClass(it.source)}">${escapeHtml(it.source||'')}</span>
            <span class="info"><b>${escapeHtml(it.sender||'')}</b>${it.subject?(' · '+escapeHtml(it.subject)):''}</span>
            <span class="time">${escapeHtml(it.time||'')}</span>
          </div>
          <div class="info">${escapeHtml(it.preview||'')}</div>
        </div>
        <button class="copy">复制</button>
      `;
      const codeEl=card.querySelector('.code');
      const copyBtn=card.querySelector('.copy');
      const doCopy=()=>copyCode(it.code, copyBtn);
      codeEl.addEventListener('click', doCopy);
      copyBtn.addEventListener('click', doCopy);
      list.appendChild(card);
      delete it._fresh;
    });
  }
  countNum.textContent=allItems.length;
}

function copyCode(code, btn){
  if(!code) return;
  navigator.clipboard.writeText(code).then(()=>{
    if(btn){btn.classList.add('done');btn.textContent='已复制✓';setTimeout(()=>{btn.classList.remove('done');btn.textContent='复制';},1500);}
    showToast('已复制 '+code);
  }).catch(()=>{
    // 兜底：用旧 API
    const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');showToast('已复制 '+code);}catch(e){}
    document.body.removeChild(ta);
  });
}

function showToast(msg){
  toast.textContent=msg;toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1800);
}

function upsert(item, fresh){
  // 去重（按 code+source+time）
  const exists=allItems.some(i=>i.code===item.code && i.source===item.source && i.time===item.time);
  if(exists) return;
  if(fresh) item._fresh=true;
  allItems.unshift(item);
  if(allItems.length>500) allItems=allItems.slice(0,500);
}

function connect(){
  const es=new EventSource('/api/stream');
  es.addEventListener('open', ()=>{
    dot.classList.add('live');status.textContent='已连接 · 实时';
  });
  es.addEventListener('history', (e)=>{
    try{
      const item=JSON.parse(e.data);
      upsert(item,false);
    }catch(err){}
    render();
  });
  es.addEventListener('code', (e)=>{
    try{
      const item=JSON.parse(e.data);
      upsert(item,true);
    }catch(err){}
    render();
  });
  es.addEventListener('error', ()=>{
    dot.classList.remove('live');status.textContent='断开，5s 后重连…';
    es.close();
    setTimeout(connect,5000);
  });
}
connect();
</script>
</body>
</html>
